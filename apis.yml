name: Rascal Games
description: >-
  Rascal Games is a game development studio founded by Rick and Jon, both
  experienced entrepreneurs previously at Blitz.gg and Discord. The studio is
  building "Project Wayward," a group-based PvE action-adventure game inspired
  by Sea of Thieves, Valheim, and Fortnite, with an emphasis on cooperative
  multiplayer experiences. Rascal Games raised a Series Seed round backed by
  a16z SPEEDRUN and industry veterans including Mitch Lasky. As a pre-launch
  game studio, Rascal Games publishes a marketing and careers site but exposes
  no public developer API, developer portal, or technical documentation surface
  at this time. This profile was surfaced as an a16z portfolio company and added
  to the API Evangelist network as a lead; the enrichment pass confirms there is
  currently no API surface to catalog.
